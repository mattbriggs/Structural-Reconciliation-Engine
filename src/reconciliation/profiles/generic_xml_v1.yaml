# Generic XML profile bundle (generic-xml-v1).
#
# Vocabulary-agnostic XML comparison. Element names remain node types, XML id
# attributes are authoritative identity, and sibling order is significant by
# default.
bundle_id: generic-xml-v1
version: v1

normalization:
  profile_id: generic-xml-normalization
  version: v1
  collapse_whitespace: true
  ignore_attribute_order: true
  nonsemantic_metadata_keys: []
  preserve_property_keys: ["id", "xml:id"]

matching:
  profile_id: generic-xml-matching
  version: v1
  evidence_priority:
    - PERSISTENT_ID
    - SEMANTIC_SIGNATURE
    - NODE_TYPE
    - CHILD_SIGNATURE
    - ANCESTOR_CONTEXT
    - WEIGHTED_SIMILARITY
  feature_weights:
    - { feature: PERSISTENT_ID, weight: 0.55 }
    - { feature: SEMANTIC_SIGNATURE, weight: 0.3 }
    - { feature: WEIGHTED_SIMILARITY, weight: 0.15 }
  authoritative_id_features: ["PERSISTENT_ID"]
  hard_constraint_node_type: true
  match_threshold: 0.6
  probable_threshold: 0.4
  ambiguity_margin: 0.05
  disable_similarity_for_translatable: false
  tie_break_keys: ["source_node_ref", "target_node_ref"]
  calibration:
    calibrated: false

alignment:
  profile_id: generic-xml-alignment
  version: v1
  strategy: LCS
  default_order_semantics: ORDERED
  order_semantics_by_type: {}
  use_anchor_partitioning: true

operation:
  profile_id: generic-xml-operations
  version: v1
  enabled_operations: ["MATCH", "INSERT", "DELETE", "UPDATE", "MOVE", "REORDER"]
  move_confidence_threshold: 0.75
  unresolved_presence_policy: SUPPRESS_AMBIGUOUS_NODES
  operation_thresholds:
    - { dimension: OPERATION, value: 0.75 }

suppression:
  profile_id: generic-xml-suppression
  version: v1
  independent_defect_check: true
  rules:
    - rule_id: generic-xml-insert-downstream-position-v1
      root_operation: INSERT
      effect_category: DOWNSTREAM_POSITION_CHANGED
      threshold: 0.6
    - rule_id: generic-xml-delete-downstream-position-v1
      root_operation: DELETE
      effect_category: DOWNSTREAM_POSITION_CHANGED
      threshold: 0.6
    - rule_id: generic-xml-move-descendant-path-v1
      root_operation: MOVE
      effect_category: DESCENDANT_PATH_CHANGED
      threshold: 0.7
    - rule_id: generic-xml-reorder-position-v1
      root_operation: REORDER
      effect_category: DOWNSTREAM_POSITION_CHANGED
      threshold: 0.6
